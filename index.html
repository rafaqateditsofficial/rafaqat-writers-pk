<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rafaqat Writers – Islamic Hadith &amp; Quran Quotes</title>
<meta name="description" content="Rafaqat Writers: a beautiful collection of Hadith, Quran verses and Islamic reminders in Urdu.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>🌙 Rafaqat Writers</h1>
<p>Hadith, Quran &amp; Islamic reminders</p>
<div style="margin-top:10px"><button class="chip" style="color:#fff;border-color:#fff" id="authBtn">Login / Sign up</button></div>
</header>
<nav id="cats"></nav>
<div class="bar"><input id="q" type="search" placeholder="Search…"></div>
<main id="grid"></main>
<footer>© Rafaqat Writers · Share good words with everyone</footer>

<dialog id="dlg">
<h3 id="dt" style="margin-top:0">Login</h3>
<input id="u" placeholder="Username" autocomplete="username">
<input id="p" type="password" placeholder="Password" autocomplete="current-password">
<div class="err" id="err"></div>
<div class="row"><button class="btn" id="go">Login</button><button class="chip" id="sw">New account</button><button class="chip" id="cl">Close</button></div>
</dialog>

<script src="script.js"></script>
</body>
</html>
